:root[data-theme=dark]{--bg:#0f1220;--fg:#e8ebf7;--card:#1b2036;--line:#3a4263;--acc:#ff922b;--mut:#9aa3c0;--el:#6aa6ff}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
[hidden]{display:none!important}
#tabs{display:flex;gap:6px;padding:8px;flex:none;border-bottom:1px solid var(--line)}
#tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#pt{flex:1;overflow:auto;padding:12px;font-size:15px}
#cl{flex:1;min-height:0;display:flex;flex-direction:column}

#info{display:flex;flex-wrap:wrap;gap:14px;background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
#atom{width:min(100%,280px);flex:none;margin:auto;color:var(--fg)}
#d{flex:1;min-width:230px}
.big{font-size:44px;font-weight:700;line-height:1}
.chips{display:flex;gap:8px;margin:10px 0}.chip{flex:1;text-align:center;border-radius:12px;padding:8px 4px;background:var(--bg)}.chip b{display:block;font-size:22px}
.chip small,.m{color:var(--mut)}
#w{overflow-x:auto;padding-bottom:6px}
#t{display:grid;grid-template-columns:repeat(18,38px);grid-template-rows:repeat(7,42px) 12px repeat(2,42px);gap:2px;width:max-content}
.e{border:1px solid;border-radius:6px;padding:1px 3px;font:inherit;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.e small{font-size:8px;opacity:.7;text-align:left}.e b{font-size:13px;text-align:center}
.e.on{outline:3px solid var(--fg)}
#lg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:12px}#lg span{padding:2px 8px;border-radius:10px;border:1px solid}
@keyframes spin{to{transform:rotate(360deg)}}


#pal{display:flex;gap:6px;overflow-x:auto;padding:8px;flex:none}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
#pal button{flex:none;white-space:nowrap}
#cv{display:block;width:100%;flex:1;min-height:220px;touch-action:none;background:radial-gradient(var(--line) 1px,transparent 1px) 0 0/20px 20px}

#pan label{display:inline-flex;flex-direction:column;gap:2px;margin:6px 10px 6px 0;color:var(--mut);font-size:12px}
#pan input[type=number]{width:120px;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.m{color:var(--mut)}
.cb{fill:var(--card);stroke:var(--line);stroke-width:2}.cb.s{stroke:var(--acc);stroke-width:3}
.tm{fill:var(--bg);stroke:var(--acc);stroke-width:2;cursor:pointer}.tm.p{fill:var(--acc)}
.lb{fill:var(--fg);font-size:10px;text-anchor:middle;pointer-events:none}.ic{font-size:17px;text-anchor:middle;fill:var(--fg);pointer-events:none}
.sy{fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.wr,.wh{fill:none;stroke-linejoin:round}.wr{stroke:var(--acc);stroke-width:3;stroke-linecap:round;pointer-events:none}.wh{stroke:transparent;stroke-width:16;cursor:pointer}
#pn{flex:1;overflow:auto;padding:12px;font-size:15px}
#pnh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.sk{display:flex;align-items:center;gap:6px;font-size:16px}.sk b{font-size:30px}
#pnw{display:flex;gap:6px;margin:10px 0}#pnw span{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--mut)}#pnw span.on{background:var(--acc);border-color:var(--acc);color:#fff}
#pnl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}#pnl button{min-width:38px}#pnl button.on{background:var(--acc);color:#fff;border-color:var(--acc)}#pnl button:disabled{opacity:.4}
#pnb{height:8px;border-radius:4px;background:var(--card);margin:8px 0}#pnb div{height:100%;width:0;border-radius:4px;background:var(--acc);transition:width .3s}
#pns{width:100%;max-width:420px;display:block;margin:0 auto;background:var(--card);border-radius:14px}
.ln{stroke:var(--fg);stroke-width:1.5}.cl{font-size:9px;fill:var(--mut)}
#pnf{min-height:24px;text-align:center;font-weight:600;margin:6px 0}#pna{overflow-x:auto;padding-bottom:6px}
.kb{position:relative;display:flex;height:130px}
.wk{flex:1;background:#f5f5f7;color:#222;border:1px solid #888;border-radius:0 0 6px 6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:11px;cursor:pointer;user-select:none}
.bk{position:absolute;top:0;height:80px;background:#1a1a24;border-radius:0 0 4px 4px;transform:translateX(-50%);z-index:2;cursor:pointer}
.wk.ok{background:#51cf66}.wk.bad{background:#ff6b6b}
.lt{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.lt button{width:44px;height:48px;font-size:18px}.lt button.ok{background:#51cf66;color:#000}.lt button.bad{background:#ff6b6b;color:#000}
.card{background:var(--card);border-radius:14px;padding:14px;text-align:center}
#pnc{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
